name: Publish Rotten Tomatoes RSS Feeds

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rss.yml"
  schedule:
    - cron: "25 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Generate Rotten Tomatoes RSS feeds
        run: |
          node <<'NODE'
          const { chromium } = require("playwright");
          const fs = require("fs");

          const feeds = [
            {
              feedTitle: "Rotten Tomatoes - New TV Shows",
              description: "Newest TV shows listed by Rotten Tomatoes",
              pageUrl:
                "https://www.rottentomatoes.com/browse/tv_series_browse/sort:newest",
              outputFile: "rottentomatoes_tv_v2.xml",
              pathPattern: /^\/tv\/[^/]+\/?$/,
              datePatterns: [
                /Latest Episode:\s*[A-Za-z]{3}\s+\d{1,2}(?:,\s*\d{4})?/i
              ]
            },
            {
              feedTitle: "Rotten Tomatoes - New Movies in Theaters",
              description: "Newest movies in theaters listed by Rotten Tomatoes",
              pageUrl:
                "https://www.rottentomatoes.com/browse/movies_in_theaters/sort:newest",
              outputFile: "rottentomatoes_theaters_v2.xml",
              pathPattern: /^\/m\/[^/]+\/?$/,
              datePatterns: [
                /Opens\s+[A-Za-z]{3}\s+\d{1,2}(?:,\s*\d{4})?/i,
                /Opening\s+[A-Za-z]{3}\s+\d{1,2}(?:,\s*\d{4})?/i,
                /In Theaters\s+[A-Za-z]{3}\s+\d{1,2}(?:,\s*\d{4})?/i
              ]
            },
            {
              feedTitle: "Rotten Tomatoes - New Movies at Home",
              description: "Newest movies available at home listed by Rotten Tomatoes",
              pageUrl:
                "https://www.rottentomatoes.com/browse/movies_at_home/sort:newest",
              outputFile: "rottentomatoes_at_home_v2.xml",
              pathPattern: /^\/m\/[^/]+\/?$/,
              datePatterns: [
                /Streaming\s+[A-Za-z]{3}\s+\d{1,2}(?:,\s*\d{4})?/i,
                /Available\s+[A-Za-z]{3}\s+\d{1,2}(?:,\s*\d{4})?/i,
                /Premieres\s+[A-Za-z]{3}\s+\d{1,2}(?:,\s*\d{4})?/i
              ]
            }
          ];

          function cleanXml(value) {
            return String(value ?? "").replace(
              /[^\u0009\u000A\u000D\u0020-\uD7FF\uE000-\uFFFD]/g,
              ""
            );
          }

          function escapeXml(value) {
            return cleanXml(value)
              .replaceAll("&", "&amp;")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;")
              .replaceAll('"', "&quot;")
              .replaceAll("'", "&apos;");
          }

          function safeCdata(value) {
            return cleanXml(value).replaceAll(
              "]]>",
              "]]]]><![CDATA[>"
            );
          }

          function parseDisplayDate(displayDate) {
            if (!displayDate) {
              return null;
            }

            const match = displayDate.match(
              /([A-Za-z]{3})\s+(\d{1,2})(?:,\s*(\d{4}))?/i
            );

            if (!match) {
              return null;
            }

            const now = new Date();
            let year = match[3]
              ? Number(match[3])
              : now.getUTCFullYear();

            let parsed = new Date(
              `${match[1]} ${match[2]}, ${year} 12:00:00 UTC`
            );

            if (Number.isNaN(parsed.getTime())) {
              return null;
            }

            if (!match[3]) {
              const futureLimit =
                now.getTime() + 60 * 24 * 60 * 60 * 1000;

              if (parsed.getTime() > futureLimit) {
                year -= 1;
                parsed = new Date(
                  `${match[1]} ${match[2]}, ${year} 12:00:00 UTC`
                );
              }
            }

            return parsed;
          }

          async function extractEntries(page, feed) {
            await page.goto(feed.pageUrl, {
              waitUntil: "domcontentloaded",
              timeout: 90000
            });

            await page.waitForSelector(
              'a[href^="/tv/"], a[href^="/m/"]',
              {
                state: "attached",
                timeout: 60000
              }
            );

            await page.waitForTimeout(5000);

            return page.evaluate(
              ({ pathPatternSource, datePatternSources }) => {
                const pathPattern = new RegExp(pathPatternSource);

                const datePatterns = datePatternSources.map(
                  (source) => new RegExp(source, "i")
                );

                const results = [];
                const seen = new Set();

                const links = Array.from(
                  document.querySelectorAll(
                    'a[href^="/tv/"], a[href^="/m/"]'
                  )
                );

                for (const link of links) {
                  const hrefValue =
                    link.getAttribute("href") || "";

                  let url;

                  try {
                    url = new URL(
                      hrefValue,
                      window.location.origin
                    );
                  } catch {
                    continue;
                  }

                  if (!pathPattern.test(url.pathname)) {
                    continue;
                  }

                  const href = url.href;

                  if (seen.has(href)) {
                    continue;
                  }

                  let container = link;
                  let poster = null;

                  for (
                    let level = 0;
                    level < 12 && container;
                    level += 1
                  ) {
                    poster = container.querySelector?.(
                      "rt-img.posterImage"
                    );

                    if (poster) {
                      break;
                    }

                    container = container.parentElement;
                  }

                  const posterTitle = (
                    poster?.getAttribute("alt") || ""
                  ).trim();

                  const linkText = (
                    link.innerText ||
                    link.textContent ||
                    ""
                  )
                    .replace(/\s+/g, " ")
                    .trim();

                  const containerText = (
                    container?.innerText || ""
                  )
                    .replace(/\s+/g, " ")
                    .trim();

                  let displayDate = "";

                  for (const pattern of datePatterns) {
                    const match = containerText.match(pattern);

                    if (match) {
                      displayDate = match[0];
                      break;
                    }
                  }

                  let title = posterTitle;

                  if (!title) {
                    title = linkText
                      .replace(
                        /Latest Episode:\s*[A-Za-z]{3}\s+\d{1,2}(?:,\s*\d{4})?/i,
                        ""
                      )
                      .replace(
                        /Opens\s+[A-Za-z]{3}\s+\d{1,2}(?:,\s*\d{4})?/i,
                        ""
                      )
                      .replace(
                        /Streaming\s+[A-Za-z]{3}\s+\d{1,2}(?:,\s*\d{4})?/i,
                        ""
                      )
                      .replace(
                        /^(?:\d{1,3}%\s*)+/,
                        ""
                      )
                      .replace(
                        /\s*Watchlist\s*$/i,
                        ""
                      )
                      .trim();
                  }

                  if (!title) {
                    continue;
                  }

                  const rawImage =
                    poster?.getAttribute("src") || "";

                  const image =
                    rawImage &&
                    rawImage !== "none"
                      ? new URL(
                          rawImage,
                          window.location.origin
                        ).href
                      : "";

                  seen.add(href);

                  results.push({
                    title,
                    href,
                    image,
                    displayDate
                  });
                }

                return results.slice(0, 50);
              },
              {
                pathPatternSource:
                  feed.pathPattern.source,

                datePatternSources:
                  feed.datePatterns.map(
                    (pattern) => pattern.source
                  )
              }
            );
          }

          function createRss(feed, entries) {
            const items = entries
              .map((entry) => {
                const published =
                  parseDisplayDate(entry.displayDate);

                const pubDate = published
                  ? `
                <pubDate>${published.toUTCString()}</pubDate>`
                  : "";

                const media = entry.image
                  ? `
                <media:content
                  url="${escapeXml(entry.image)}"
                  medium="image" />`
                  : "";

                const description = [
                  entry.image
                    ? `<p><img src="${escapeXml(
                        entry.image
                      )}" alt="${escapeXml(
                        entry.title
                      )}" /></p>`
                    : "",

                  `<p><strong>${escapeXml(
                    entry.title
                  )}</strong></p>`,

                  entry.displayDate
                    ? `<p>${escapeXml(
                        entry.displayDate
                      )}</p>`
                    : "",

                  `<p><a href="${escapeXml(
                    entry.href
                  )}">Open on Rotten Tomatoes</a></p>`
                ]
                  .filter(Boolean)
                  .join("\n");

                return `
              <item>
                <title>${escapeXml(entry.title)}</title>
                <link>${escapeXml(entry.href)}</link>
                <guid isPermaLink="true">${escapeXml(
                  entry.href
                )}</guid>${pubDate}${media}
                <description><![CDATA[${safeCdata(
                  description
                )}]]></description>
              </item>`;
              })
              .join("\n");

            return `<?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0"
               xmlns:atom="http://www.w3.org/2005/Atom"
               xmlns:media="http://search.yahoo.com/mrss/">
            <channel>
              <title>${escapeXml(feed.feedTitle)}</title>
              <link>${escapeXml(feed.pageUrl)}</link>
              <description>${escapeXml(
                feed.description
              )}</description>
              <language>en</language>
              <lastBuildDate>${new Date().toUTCString()}</lastBuildDate>
              <atom:link
                href="https://pkashe.github.io/more-feeds/${escapeXml(
                  feed.outputFile
                )}"
                rel="self"
                type="application/rss+xml" />
          ${items}
            </channel>
          </rss>
          `;
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            try {
              const context = await browser.newContext({
                userAgent:
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) " +
                  "AppleWebKit/537.36 (KHTML, like Gecko) " +
                  "Chrome/124.0.0.0 Safari/537.36",

                viewport: {
                  width: 1440,
                  height: 1600
                }
              });

              const page = await context.newPage();

              fs.mkdirSync("public", {
                recursive: true
              });

              const generatedFeeds = [];

              for (const feed of feeds) {
                console.log(
                  `Processing ${feed.feedTitle}...`
                );

                const entries = await extractEntries(
                  page,
                  feed
                );

                if (!entries.length) {
                  throw new Error(
                    `No entries found for ${feed.feedTitle}.`
                  );
                }

                const rss = createRss(
                  feed,
                  entries
                );

                fs.writeFileSync(
                  `public/${feed.outputFile}`,
                  rss,
                  "utf8"
                );

                generatedFeeds.push(feed);

                console.log(
                  `Generated ${entries.length} entries ` +
                  `for ${feed.outputFile}.`
                );

                for (const entry of entries.slice(0, 5)) {
                  console.log(
                    `- ${entry.title}: ${entry.href}`
                  );
                }
              }

              const indexLinks = generatedFeeds
                .map(
                  (feed) =>
                    `<li><a href="${escapeXml(
                      feed.outputFile
                    )}">${escapeXml(
                      feed.feedTitle
                    )}</a></li>`
                )
                .join("\n");

              fs.writeFileSync(
                "public/index.html",
                `<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>More Feeds</title>
          </head>
          <body>
            <h1>More Feeds</h1>
            <ul>
              ${indexLinks}
            </ul>
          </body>
          </html>`,
                "utf8"
              );

              fs.writeFileSync(
                "public/.nojekyll",
                "",
                "utf8"
              );
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
