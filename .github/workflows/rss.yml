name: Publish Rotten Tomatoes TV RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "25 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Generate TV RSS feed
        run: |
          node <<'NODE'
          const { chromium } = require("playwright");
          const fs = require("fs");

          const pageUrl =
            "https://www.rottentomatoes.com/browse/tv_series_browse/sort:newest";

          function escapeXml(value) {
            return String(value ?? "")
              .replaceAll("&", "&amp;")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;")
              .replaceAll('"', "&quot;")
              .replaceAll("'", "&apos;");
          }

          function safeCdata(value) {
            return String(value ?? "").replaceAll(
              "]]>",
              "]]]]><![CDATA[>"
            );
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            try {
              const context = await browser.newContext({
                userAgent:
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) " +
                  "AppleWebKit/537.36 (KHTML, like Gecko) " +
                  "Chrome/124.0.0.0 Safari/537.36",
                viewport: {
                  width: 1440,
                  height: 1600
                }
              });

              const page = await context.newPage();

              await page.goto(pageUrl, {
                waitUntil: "domcontentloaded",
                timeout: 90000
              });

              await page.waitForSelector(
                'a[href^="/tv/"]',
                {
                  state: "attached",
                  timeout: 60000
                }
              );

              await page.waitForTimeout(5000);

              const shows = await page.evaluate(() => {
                const results = [];
                const seen = new Set();

                const links = Array.from(
                  document.querySelectorAll(
                    'a[href^="/tv/"]'
                  )
                );

                for (const link of links) {
                  const hrefValue =
                    link.getAttribute("href") || "";

                  if (
                    !/^\/tv\/[^/]+\/?$/.test(hrefValue)
                  ) {
                    continue;
                  }

                  const href = new URL(
                    hrefValue,
                    window.location.origin
                  ).href;

                  if (seen.has(href)) {
                    continue;
                  }

                  let container = link;

                  let poster = null;

                  for (
                    let level = 0;
                    level < 10 && container;
                    level += 1
                  ) {
                    poster = container.querySelector?.(
                      "rt-img.posterImage"
                    );

                    if (poster) {
                      break;
                    }

                    container =
                      container.parentElement;
                  }

                  const posterTitle = (
                    poster?.getAttribute("alt") || ""
                  ).trim();

                  const linkText = (
                    link.innerText ||
                    link.textContent ||
                    ""
                  )
                    .replace(/\s+/g, " ")
                    .trim();

                  const containerText = (
                    container?.innerText || ""
                  )
                    .replace(/\s+/g, " ")
                    .trim();

                  const latestEpisodeMatch =
                    containerText.match(
                      /Latest Episode:\s*[A-Za-z]{3}\s+\d{1,2}/i
                    );

                  const latestEpisode =
                    latestEpisodeMatch?.[0] || "";

                  let title = posterTitle;

                  if (!title) {
                    title = linkText
                      .replace(
                        /Latest Episode:\s*[A-Za-z]{3}\s+\d{1,2}/i,
                        ""
                      )
                      .replace(
                        /^(?:\d{1,3}%\s*)+/,
                        ""
                      )
                      .replace(
                        /\s*Watchlist\s*$/i,
                        ""
                      )
                      .trim();
                  }

                  if (!title) {
                    continue;
                  }

                  const rawImage =
                    poster?.getAttribute("src") || "";

                  const image =
                    rawImage &&
                    rawImage !== "none"
                      ? new URL(
                          rawImage,
                          window.location.origin
                        ).href
                      : "";

                  seen.add(href);

                  results.push({
                    title,
                    href,
                    image,
                    latestEpisode
                  });
                }

                return results.slice(0, 50);
              });

              if (!shows.length) {
                throw new Error(
                  "No Rotten Tomatoes TV entries were found."
                );
              }

              fs.mkdirSync("public", {
                recursive: true
              });

              const items = shows
                .map((show) => {
                  const description = [
                    show.image
                      ? `<p><img src="${escapeXml(
                          show.image
                        )}" alt="${escapeXml(
                          show.title
                        )}" /></p>`
                      : "",

                    `<p><strong>${escapeXml(
                      show.title
                    )}</strong></p>`,

                    show.latestEpisode
                      ? `<p>${escapeXml(
                          show.latestEpisode
                        )}</p>`
                      : "",

                    `<p><a href="${escapeXml(
                      show.href
                    )}">Open on Rotten Tomatoes</a></p>`
                  ]
                    .filter(Boolean)
                    .join("\n");

                  const media = show.image
                    ? `
                <media:content
                  url="${escapeXml(show.image)}"
                  medium="image" />`
                    : "";

                  return `
              <item>
                <title>${escapeXml(show.title)}</title>
                <link>${escapeXml(show.href)}</link>
                <guid isPermaLink="true">${escapeXml(
                  show.href
                )}</guid>${media}
                <description><![CDATA[${safeCdata(
                  description
                )}]]></description>
              </item>`;
                })
                .join("\n");

              const rss = `<?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0"
               xmlns:atom="http://www.w3.org/2005/Atom"
               xmlns:media="http://search.yahoo.com/mrss/">
            <channel>
              <title>Rotten Tomatoes - New TV Shows</title>
              <link>${escapeXml(pageUrl)}</link>
              <description>Newest TV shows listed by Rotten Tomatoes</description>
              <language>en</language>
              <lastBuildDate>${new Date().toUTCString()}</lastBuildDate>
              <atom:link
                href="https://pkashe.github.io/more-feeds/rottentomatoes_tv.xml"
                rel="self"
                type="application/rss+xml" />
          ${items}
            </channel>
          </rss>
          `;

              fs.writeFileSync(
                "public/rottentomatoes_tv.xml",
                rss,
                "utf8"
              );

              fs.writeFileSync(
                "public/index.html",
                `<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>More Feeds</title>
          </head>
          <body>
            <h1>More Feeds</h1>
            <p>
              <a href="rottentomatoes_tv.xml">
                Rotten Tomatoes - New TV Shows
              </a>
            </p>
          </body>
          </html>`,
                "utf8"
              );

              fs.writeFileSync(
                "public/.nojekyll",
                "",
                "utf8"
              );

              console.log(
                `Generated ${shows.length} TV entries.`
              );

              for (const show of shows.slice(0, 10)) {
                console.log(
                  `- ${show.title}: ${show.href}`
                );
              }
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
