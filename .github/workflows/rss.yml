name: Publish RSS Feeds

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rss.yml"
  schedule:
    - cron: "25 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          npm install --no-save playwright fast-xml-parser
          npx playwright install --with-deps chromium

      - name: Generate RSS feeds
        run: |
          node <<'NODE'
          const { chromium } = require("playwright");
          const { XMLParser } = require("fast-xml-parser");
          const fs = require("fs");

          const siteBase =
            "https://pkashe.github.io/more-feeds";

          const rottenTomatoesFeeds = [
            {
              feedTitle:
                "Rotten Tomatoes - New TV Shows",
              description:
                "Newest TV shows listed by Rotten Tomatoes",
              pageUrl:
                "https://www.rottentomatoes.com/browse/tv_series_browse/sort:newest",
              outputFile:
                "rottentomatoes_tv_v2.xml",
              pathPattern:
                /^\/tv\/[^/]+\/?$/,
              datePatterns: [
                /Latest Episode:\s*[A-Za-z]{3}\s+\d{1,2}(?:,\s*\d{4})?/i
              ]
            },
            {
              feedTitle:
                "Rotten Tomatoes - New Movies in Theaters",
              description:
                "Newest movies in theaters listed by Rotten Tomatoes",
              pageUrl:
                "https://www.rottentomatoes.com/browse/movies_in_theaters/sort:newest",
              outputFile:
                "rottentomatoes_theaters_v2.xml",
              pathPattern:
                /^\/m\/[^/]+\/?$/,
              datePatterns: [
                /Opened\s+[A-Za-z]{3}\s+\d{1,2}(?:,\s*\d{4})?/i,
                /Opens\s+[A-Za-z]{3}\s+\d{1,2}(?:,\s*\d{4})?/i,
                /Opening\s+[A-Za-z]{3}\s+\d{1,2}(?:,\s*\d{4})?/i,
                /In Theaters\s+[A-Za-z]{3}\s+\d{1,2}(?:,\s*\d{4})?/i,
                /Re-released\s+[A-Za-z]{3}\s+\d{1,2}(?:,\s*\d{4})?/i
              ]
            },
            {
              feedTitle:
                "Rotten Tomatoes - New Movies at Home",
              description:
                "Newest movies available at home listed by Rotten Tomatoes",
              pageUrl:
                "https://www.rottentomatoes.com/browse/movies_at_home/sort:newest",
              outputFile:
                "rottentomatoes_at_home_v2.xml",
              pathPattern:
                /^\/m\/[^/]+\/?$/,
              datePatterns: [
                /Streaming\s+[A-Za-z]{3}\s+\d{1,2}(?:,\s*\d{4})?/i,
                /Available\s+[A-Za-z]{3}\s+\d{1,2}(?:,\s*\d{4})?/i,
                /Premieres\s+[A-Za-z]{3}\s+\d{1,2}(?:,\s*\d{4})?/i
              ]
            }
          ];

          const layoffFeed = {
            feedTitle:
              "ResMed - TheLayoff",
            description:
              "Latest ResMed discussions from TheLayoff",
            pageUrl:
              "https://www.thelayoff.com/resmed",
            outputFile:
              "resmed_thelayoff_v2.xml"
          };

          const boxdenFeed = {
            feedTitle:
              "Boxden - TV / Movies",
            description:
              "Latest Boxden TV / Movies discussions",
            pageUrl:
              "https://boxden.com/forumdisplay.php?f=218",
            outputFile:
              "boxden_tv_movies_v2.xml",
            sourceUrls: [
              "http://slumz.boxden.com/external.php?type=RSS2&count=100",
              "https://slumz.boxden.com/external.php?type=RSS2&count=100",
              "http://slumz.boxden.com/external.php?type=RSS2"
            ]
          };

          function cleanXml(value) {
            return String(value ?? "").replace(
              /[^\u0009\u000A\u000D\u0020-\uD7FF\uE000-\uFFFD]/g,
              ""
            );
          }

          function escapeXml(value) {
            return cleanXml(value)
              .replaceAll("&", "&amp;")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;")
              .replaceAll('"', "&quot;")
              .replaceAll("'", "&apos;");
          }

          function safeCdata(value) {
            return cleanXml(value).replaceAll(
              "]]>",
              "]]]]><![CDATA[>"
            );
          }

          function valueText(value) {
            if (
              value === null ||
              value === undefined
            ) {
              return "";
            }

            if (
              typeof value === "string" ||
              typeof value === "number" ||
              typeof value === "boolean"
            ) {
              return String(value);
            }

            if (Array.isArray(value)) {
              return value
                .map(valueText)
                .join("");
            }

            if (typeof value === "object") {
              return (
                valueText(value["#cdata"]) ||
                valueText(value["#text"]) ||
                ""
              );
            }

            return "";
          }

          function parseDisplayDate(displayDate) {
            if (!displayDate) {
              return null;
            }

            const match =
              displayDate.match(
                /([A-Za-z]{3})\s+(\d{1,2})(?:,\s*(\d{4}))?/i
              );

            if (!match) {
              return null;
            }

            const now = new Date();

            let year = match[3]
              ? Number(match[3])
              : now.getUTCFullYear();

            let parsed = new Date(
              `${match[1]} ${match[2]}, ${year} 12:00:00 UTC`
            );

            if (
              Number.isNaN(
                parsed.getTime()
              )
            ) {
              return null;
            }

            if (!match[3]) {
              const futureLimit =
                now.getTime() +
                60 *
                  24 *
                  60 *
                  60 *
                  1000;

              if (
                parsed.getTime() >
                futureLimit
              ) {
                year -= 1;

                parsed = new Date(
                  `${match[1]} ${match[2]}, ${year} 12:00:00 UTC`
                );
              }
            }

            return parsed;
          }

          function createRssDocument(
            feed,
            items
          ) {
            return `<?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0"
               xmlns:atom="http://www.w3.org/2005/Atom"
               xmlns:media="http://search.yahoo.com/mrss/"
               xmlns:dc="http://purl.org/dc/elements/1.1/"
               xmlns:content="http://purl.org/rss/1.0/modules/content/">
            <channel>
              <title>${escapeXml(
                feed.feedTitle
              )}</title>
              <link>${escapeXml(
                feed.pageUrl
              )}</link>
              <description>${escapeXml(
                feed.description
              )}</description>
              <language>en</language>
              <lastBuildDate>${new Date().toUTCString()}</lastBuildDate>
              <atom:link
                href="${siteBase}/${escapeXml(
                  feed.outputFile
                )}"
                rel="self"
                type="application/rss+xml" />
          ${items}
            </channel>
          </rss>
          `;
          }

          async function restorePreviousFeed(
            feed
          ) {
            try {
              const response =
                await fetch(
                  `${siteBase}/` +
                    `${feed.outputFile}` +
                    `?cache=${Date.now()}`,
                  {
                    headers: {
                      "cache-control":
                        "no-cache",
                      "user-agent":
                        "Mozilla/5.0"
                    }
                  }
                );

              if (!response.ok) {
                return false;
              }

              const xml =
                await response.text();

              if (
                !xml.includes("<rss") ||
                !xml.includes("<item>")
              ) {
                return false;
              }

              fs.writeFileSync(
                `public/${feed.outputFile}`,
                xml,
                "utf8"
              );

              console.log(
                `Restored previous ${feed.outputFile}.`
              );

              return true;
            } catch (error) {
              console.warn(
                `Could not restore previous ${feed.outputFile}:`,
                error.message || error
              );

              return false;
            }
          }

          async function extractRottenTomatoesEntries(
            page,
            feed
          ) {
            await page.goto(
              feed.pageUrl,
              {
                waitUntil:
                  "domcontentloaded",
                timeout: 90000
              }
            );

            await page.waitForSelector(
              'a[href^="/tv/"], a[href^="/m/"]',
              {
                state: "attached",
                timeout: 60000
              }
            );

            await page.waitForTimeout(
              5000
            );

            return page.evaluate(
              ({
                pathPatternSource,
                datePatternSources
              }) => {
                const pathPattern =
                  new RegExp(
                    pathPatternSource
                  );

                const datePatterns =
                  datePatternSources.map(
                    (source) =>
                      new RegExp(
                        source,
                        "i"
                      )
                  );

                function cleanText(value) {
                  return String(
                    value || ""
                  )
                    .replace(/\s+/g, " ")
                    .trim();
                }

                function findDate(text) {
                  for (
                    const pattern of
                    datePatterns
                  ) {
                    const match =
                      text.match(pattern);

                    if (match) {
                      return match[0];
                    }
                  }

                  return "";
                }

                function removeDate(
                  text,
                  displayDate
                ) {
                  if (!displayDate) {
                    return text;
                  }

                  return text
                    .replace(
                      displayDate,
                      " "
                    )
                    .replace(/\s+/g, " ")
                    .trim();
                }

                function removeScores(text) {
                  return String(
                    text || ""
                  )
                    .replace(
                      /(?:^|\s)\d{1,3}%/g,
                      " "
                    )
                    .replace(
                      /\bWatchlist\b/gi,
                      " "
                    )
                    .replace(/\s+/g, " ")
                    .trim();
                }

                function removeAccessibilityText(
                  text
                ) {
                  let cleaned =
                    cleanText(text);

                  const linkToIndex =
                    cleaned
                      .toLowerCase()
                      .indexOf(
                        " link to "
                      );

                  if (linkToIndex > 0) {
                    cleaned =
                      cleaned
                        .slice(
                          0,
                          linkToIndex
                        )
                        .trim();
                  }

                  return cleaned
                    .replace(
                      /^link to\s+/i,
                      ""
                    )
                    .trim();
                }

                function isMatchingMediaLink(
                  candidate
                ) {
                  const hrefValue =
                    candidate.getAttribute(
                      "href"
                    ) || "";

                  try {
                    const url =
                      new URL(
                        hrefValue,
                        window.location.origin
                      );

                    return pathPattern.test(
                      url.pathname
                    );
                  } catch {
                    return false;
                  }
                }

                function hasUsableImage(
                  element
                ) {
                  return Boolean(
                    element?.querySelector?.(
                      [
                        "rt-img.posterImage",
                        "rt-img",
                        "img.posterImage",
                        'img[data-qa*="poster"]',
                        'img[class*="poster"]',
                        "picture img",
                        "img"
                      ].join(",")
                    )
                  );
                }

                function getCardContainer(
                  link
                ) {
                  const preferred =
                    link.closest(
                      [
                        "media-list-item",
                        "tile-dynamic",
                        '[data-qa="discovery-media-list-item"]',
                        '[data-qa*="media-list-item"]',
                        '[data-qa*="discovery-media"]',
                        "article"
                      ].join(",")
                    );

                  if (
                    preferred &&
                    hasUsableImage(
                      preferred
                    )
                  ) {
                    return preferred;
                  }

                  let current =
                    link.parentElement;

                  let firstWithImage =
                    null;

                  for (
                    let level = 0;
                    level < 14 &&
                    current;
                    level += 1
                  ) {
                    if (
                      hasUsableImage(
                        current
                      ) &&
                      !firstWithImage
                    ) {
                      firstWithImage =
                        current;
                    }

                    const matchingLinks =
                      Array.from(
                        current.querySelectorAll(
                          'a[href^="/tv/"], a[href^="/m/"]'
                        )
                      ).filter(
                        isMatchingMediaLink
                      );

                    const uniqueHrefs =
                      new Set(
                        matchingLinks.map(
                          (
                            candidate
                          ) => {
                            try {
                              return new URL(
                                candidate.getAttribute(
                                  "href"
                                ) || "",
                                window.location.origin
                              ).href;
                            } catch {
                              return "";
                            }
                          }
                        )
                      );

                    uniqueHrefs.delete("");

                    if (
                      hasUsableImage(
                        current
                      ) &&
                      uniqueHrefs.size ===
                        1
                    ) {
                      return current;
                    }

                    current =
                      current.parentElement;
                  }

                  return (
                    firstWithImage ||
                    link.parentElement
                  );
                }

                function firstSrcsetUrl(
                  srcset
                ) {
                  if (!srcset) {
                    return "";
                  }

                  const firstPart =
                    String(srcset)
                      .split(",")[0]
                      .trim();

                  return (
                    firstPart
                      .split(/\s+/)[0] ||
                    ""
                  );
                }

                function makeAbsoluteImageUrl(
                  value
                ) {
                  if (
                    !value ||
                    value === "none" ||
                    value.startsWith(
                      "data:"
                    )
                  ) {
                    return "";
                  }

                  try {
                    return new URL(
                      value,
                      window.location.origin
                    ).href;
                  } catch {
                    return "";
                  }
                }

                function extractImageUrl(
                  container,
                  link
                ) {
                  const selectors = [
                    "rt-img.posterImage",
                    "rt-img",
                    "img.posterImage",
                    'img[data-qa*="poster"]',
                    'img[class*="poster"]',
                    "picture img",
                    "img"
                  ];

                  const candidates = [];

                  for (
                    const selector of
                    selectors
                  ) {
                    const direct =
                      link.querySelector?.(
                        selector
                      );

                    if (
                      direct &&
                      !candidates.includes(
                        direct
                      )
                    ) {
                      candidates.push(
                        direct
                      );
                    }

                    const cardImage =
                      container?.querySelector?.(
                        selector
                      );

                    if (
                      cardImage &&
                      !candidates.includes(
                        cardImage
                      )
                    ) {
                      candidates.push(
                        cardImage
                      );
                    }
                  }

                  for (
                    const candidate of
                    candidates
                  ) {
                    const nestedImage =
                      candidate.tagName
                        ?.toLowerCase() ===
                      "rt-img"
                        ? candidate.querySelector(
                            "img"
                          )
                        : candidate;

                    const values = [
                      nestedImage
                        ?.currentSrc,
                      nestedImage
                        ?.getAttribute?.(
                          "src"
                        ),
                      nestedImage
                        ?.getAttribute?.(
                          "data-src"
                        ),
                      nestedImage
                        ?.getAttribute?.(
                          "data-lazy-src"
                        ),
                      firstSrcsetUrl(
                        nestedImage
                          ?.getAttribute?.(
                            "srcset"
                          )
                      ),
                      firstSrcsetUrl(
                        nestedImage
                          ?.getAttribute?.(
                            "data-srcset"
                          )
                      ),
                      candidate
                        ?.getAttribute?.(
                          "src"
                        ),
                      candidate
                        ?.getAttribute?.(
                          "data-src"
                        ),
                      candidate
                        ?.getAttribute?.(
                          "data-lazy-src"
                        ),
                      firstSrcsetUrl(
                        candidate
                          ?.getAttribute?.(
                            "srcset"
                          )
                      )
                    ];

                    const picture =
                      nestedImage?.closest?.(
                        "picture"
                      );

                    if (picture) {
                      for (
                        const source of
                        picture.querySelectorAll(
                          "source"
                        )
                      ) {
                        values.push(
                          firstSrcsetUrl(
                            source.getAttribute(
                              "srcset"
                            )
                          )
                        );

                        values.push(
                          firstSrcsetUrl(
                            source.getAttribute(
                              "data-srcset"
                            )
                          )
                        );
                      }
                    }

                    for (
                      const value of
                      values
                    ) {
                      const absolute =
                        makeAbsoluteImageUrl(
                          value
                        );

                      if (absolute) {
                        return absolute;
                      }
                    }
                  }

                  return "";
                }

                const results = [];
                const seen = new Set();

                const links =
                  Array.from(
                    document.querySelectorAll(
                      'a[href^="/tv/"], a[href^="/m/"]'
                    )
                  );

                for (const link of links) {
                  const hrefValue =
                    link.getAttribute(
                      "href"
                    ) || "";

                  let url;

                  try {
                    url = new URL(
                      hrefValue,
                      window.location.origin
                    );
                  } catch {
                    continue;
                  }

                  if (
                    !pathPattern.test(
                      url.pathname
                    )
                  ) {
                    continue;
                  }

                  const linkText =
                    cleanText(
                      link.innerText ||
                      link.textContent
                    );

                  const displayDate =
                    findDate(linkText);

                  /*
                   * Only use the dated caption link for each
                   * card. This rejects hidden, poster-only and
                   * unrelated links.
                   */
                  if (!displayDate) {
                    continue;
                  }

                  const href =
                    url.href;

                  if (seen.has(href)) {
                    continue;
                  }

                  let title =
                    removeDate(
                      linkText,
                      displayDate
                    );

                  title =
                    removeScores(title);

                  title =
                    removeAccessibilityText(
                      title
                    );

                  if (!title) {
                    continue;
                  }

                  const container =
                    getCardContainer(
                      link
                    );

                  const image =
                    extractImageUrl(
                      container,
                      link
                    );

                  seen.add(href);

                  results.push({
                    title,
                    href,
                    image,
                    displayDate
                  });
                }

                return results.slice(
                  0,
                  50
                );
              },
              {
                pathPatternSource:
                  feed.pathPattern
                    .source,

                datePatternSources:
                  feed.datePatterns.map(
                    (pattern) =>
                      pattern.source
                  )
              }
            );
          }

          function createRottenTomatoesRss(
            feed,
            entries
          ) {
            const items =
              entries
                .map((entry) => {
                  const published =
                    parseDisplayDate(
                      entry.displayDate
                    );

                  const pubDate =
                    published
                      ? `
                <pubDate>${published.toUTCString()}</pubDate>`
                      : "";

                  const media =
                    entry.image
                      ? `
                <media:content
                  url="${escapeXml(
                    entry.image
                  )}"
                  medium="image" />`
                      : "";

                  const description = [
                    entry.image
                      ? `<p><img src="${escapeXml(
                          entry.image
                        )}" alt="${escapeXml(
                          entry.title
                        )}" /></p>`
                      : "",

                    `<p><strong>${escapeXml(
                      entry.title
                    )}</strong></p>`,

                    entry.displayDate
                      ? `<p>${escapeXml(
                          entry.displayDate
                        )}</p>`
                      : "",

                    `<p><a href="${escapeXml(
                      entry.href
                    )}">Open on Rotten Tomatoes</a></p>`
                  ]
                    .filter(Boolean)
                    .join("\n");

                  return `
              <item>
                <title>${escapeXml(
                  entry.title
                )}</title>
                <link>${escapeXml(
                  entry.href
                )}</link>
                <guid isPermaLink="true">${escapeXml(
                  entry.href
                )}</guid>${pubDate}${media}
                <description><![CDATA[${safeCdata(
                  description
                )}]]></description>
              </item>`;
                })
                .join("\n");

            return createRssDocument(
              feed,
              items
            );
          }

          async function extractLayoffEntries(
            page
          ) {
            await page.goto(
              layoffFeed.pageUrl,
              {
                waitUntil:
                  "domcontentloaded",
                timeout: 90000
              }
            );

            await page.waitForTimeout(
              5000
            );

            const pageTitle =
              await page
                .title()
                .catch(() => "");

            const bodyText =
              await page
                .locator("body")
                .innerText()
                .catch(() => "");

            if (
              /cloudflare|verify you are human|security verification/i.test(
                `${pageTitle} ${bodyText}`
              )
            ) {
              throw new Error(
                "TheLayoff returned a verification page."
              );
            }

            const threadCount =
              await page
                .locator(
                  'a[href^="/t/"]'
                )
                .count();

            if (!threadCount) {
              throw new Error(
                "No TheLayoff discussion links were found."
              );
            }

            return page.evaluate(
              () => {
                const results = [];

                const seenThreadIds =
                  new Set();

                const links =
                  Array.from(
                    document.querySelectorAll(
                      'a[href^="/t/"]'
                    )
                  );

                for (const link of links) {
                  const hrefValue =
                    link.getAttribute(
                      "href"
                    ) || "";

                  const threadMatch =
                    hrefValue.match(
                      /^\/t\/([A-Za-z0-9_-]+)/
                    );

                  if (!threadMatch) {
                    continue;
                  }

                  if (
                    hrefValue.includes(
                      "#replies"
                    )
                  ) {
                    continue;
                  }

                  const linkText = (
                    link.innerText ||
                    link.textContent ||
                    ""
                  )
                    .replace(/\s+/g, " ")
                    .trim();

                  if (
                    /^\d+\s+(?:reply|replies|comment|comments)$/i.test(
                      linkText
                    )
                  ) {
                    continue;
                  }

                  const threadId =
                    threadMatch[1];

                  if (
                    seenThreadIds.has(
                      threadId
                    )
                  ) {
                    continue;
                  }

                  let container =
                    link;

                  for (
                    let level = 0;
                    level < 8 &&
                    container;
                    level += 1
                  ) {
                    const text = (
                      container.innerText ||
                      ""
                    )
                      .replace(
                        /\s+/g,
                        " "
                      )
                      .trim();

                    if (
                      text.length >= 20 &&
                      text.length <= 3000
                    ) {
                      break;
                    }

                    container =
                      container.parentElement;
                  }

                  const containerText = (
                    container
                      ?.innerText ||
                    ""
                  )
                    .replace(/\s+/g, " ")
                    .trim();

                  let title =
                    linkText;

                  if (
                    !title ||
                    title.length < 3
                  ) {
                    const heading =
                      container
                        ?.querySelector(
                          "h1, h2, h3, h4, strong"
                        );

                    title = (
                      heading
                        ?.innerText ||
                      ""
                    )
                      .replace(
                        /\s+/g,
                        " "
                      )
                      .trim();
                  }

                  if (
                    !title ||
                    title.length < 3 ||
                    /^\d+\s+(?:reply|replies|comment|comments)$/i.test(
                      title
                    )
                  ) {
                    continue;
                  }

                  if (
                    title.length > 250
                  ) {
                    title =
                      title.slice(
                        0,
                        247
                      ) + "...";
                  }

                  const href =
                    new URL(
                      `/t/${threadId}`,
                      window.location.origin
                    ).href;

                  let description =
                    containerText ||
                    title;

                  description =
                    description
                      .replace(
                        title,
                        ""
                      )
                      .replace(
                        /\s+/g,
                        " "
                      )
                      .trim();

                  if (
                    description.length >
                    1500
                  ) {
                    description =
                      description.slice(
                        0,
                        1497
                      ) + "...";
                  }

                  const dateMatch =
                    containerText.match(
                      /\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d{1,2}(?:,\s*\d{4})?\b/i
                    ) ||
                    containerText.match(
                      /\b\d{1,2}\s+(?:minute|hour|day|week|month|year)s?\s+ago\b/i
                    );

                  const repliesMatch =
                    containerText.match(
                      /\b\d+\s+(?:reply|replies|comment|comments)\b/i
                    );

                  seenThreadIds.add(
                    threadId
                  );

                  results.push({
                    title,
                    href,
                    description,
                    displayDate:
                      dateMatch?.[0] ||
                      "",
                    replies:
                      repliesMatch?.[0] ||
                      ""
                  });
                }

                return results.slice(
                  0,
                  50
                );
              }
            );
          }

          function createLayoffRss(
            entries
          ) {
            const items =
              entries
                .map((entry) => {
                  const description = [
                    entry.description
                      ? `<p>${escapeXml(
                          entry.description
                        )}</p>`
                      : "",

                    entry.displayDate
                      ? `<p>${escapeXml(
                          entry.displayDate
                        )}</p>`
                      : "",

                    entry.replies
                      ? `<p>${escapeXml(
                          entry.replies
                        )}</p>`
                      : "",

                    `<p><a href="${escapeXml(
                      entry.href
                    )}">Open discussion on TheLayoff</a></p>`
                  ]
                    .filter(Boolean)
                    .join("\n");

                  return `
              <item>
                <title>${escapeXml(
                  entry.title
                )}</title>
                <link>${escapeXml(
                  entry.href
                )}</link>
                <guid isPermaLink="true">${escapeXml(
                  entry.href
                )}</guid>
                <description><![CDATA[${safeCdata(
                  description
                )}]]></description>
              </item>`;
                })
                .join("\n");

            return createRssDocument(
              layoffFeed,
              items
            );
          }

          async function fetchBoxdenXml() {
            const errors = [];

            for (
              const sourceUrl of
              boxdenFeed.sourceUrls
            ) {
              try {
                console.log(
                  `Trying Boxden RSS: ${sourceUrl}`
                );

                const response =
                  await fetch(
                    sourceUrl,
                    {
                      redirect:
                        "follow",

                      headers: {
                        accept:
                          "application/rss+xml, application/xml, text/xml, */*",

                        "user-agent":
                          "Mozilla/5.0 (Windows NT 10.0; Win64; x64) " +
                          "AppleWebKit/537.36 Chrome/124.0.0.0 Safari/537.36"
                      }
                    }
                  );

                if (!response.ok) {
                  throw new Error(
                    `HTTP ${response.status}`
                  );
                }

                const bytes =
                  new Uint8Array(
                    await response
                      .arrayBuffer()
                  );

                const xml =
                  new TextDecoder(
                    "windows-1252"
                  ).decode(bytes);

                if (
                  !xml.includes("<rss") ||
                  !xml.includes("<item>")
                ) {
                  throw new Error(
                    "Response was not a usable RSS feed"
                  );
                }

                console.log(
                  `Boxden RSS loaded from ${sourceUrl}.`
                );

                return xml;
              } catch (error) {
                errors.push(
                  `${sourceUrl}: ${
                    error.message ||
                    error
                  }`
                );
              }
            }

            throw new Error(
              "All Boxden RSS sources failed: " +
                errors.join(" | ")
            );
          }

          async function extractBoxdenEntries() {
            const xml =
              await fetchBoxdenXml();

            const parser =
              new XMLParser({
                ignoreAttributes:
                  false,
                attributeNamePrefix:
                  "@_",
                textNodeName:
                  "#text",
                cdataPropName:
                  "#cdata",
                processEntities:
                  true,
                parseTagValue:
                  false,
                parseAttributeValue:
                  false,
                trimValues:
                  false
              });

            const parsed =
              parser.parse(xml);

            const rawItems =
              parsed?.rss
                ?.channel
                ?.item;

            const items =
              Array.isArray(
                rawItems
              )
                ? rawItems
                : rawItems
                  ? [rawItems]
                  : [];

            const results = [];

            for (const item of items) {
              const rawCategories =
                Array.isArray(
                  item.category
                )
                  ? item.category
                  : item.category
                    ? [
                        item.category
                      ]
                    : [];

              const category =
                rawCategories.find(
                  (candidate) => {
                    const domain =
                      typeof candidate ===
                      "object"
                        ? String(
                            candidate[
                              "@_domain"
                            ] || ""
                          )
                        : "";

                    const name =
                      valueText(
                        candidate
                      )
                        .replace(
                          /\s+/g,
                          " "
                        )
                        .trim()
                        .toLowerCase();

                    return (
                      /forumdisplay\.php\?f=218(?:$|&)/i.test(
                        domain
                      ) ||
                      name ===
                        "tv / movies"
                    );
                  }
                );

              if (!category) {
                continue;
              }

              const title =
                valueText(
                  item.title
                ).trim();

              const link =
                valueText(
                  item.link
                ).trim();

              const pubDate =
                valueText(
                  item.pubDate
                ).trim();

              const description =
                valueText(
                  item.description
                ).trim();

              const content =
                valueText(
                  item[
                    "content:encoded"
                  ]
                ).trim();

              const creator =
                valueText(
                  item[
                    "dc:creator"
                  ]
                ).trim();

              const guid =
                valueText(
                  item.guid
                ).trim() ||
                link;

              const categoryName =
                valueText(
                  category
                ).trim() ||
                "tv / movies";

              const categoryDomain =
                typeof category ===
                "object"
                  ? String(
                      category[
                        "@_domain"
                      ] || ""
                    )
                  : "https://boxden.com/forumdisplay.php?f=218";

              if (
                !title ||
                !link
              ) {
                continue;
              }

              results.push({
                title,
                link,
                pubDate,
                description,
                content,
                creator,
                guid,
                categoryName,
                categoryDomain
              });
            }

            if (!results.length) {
              throw new Error(
                "The Boxden RSS loaded, but it contained no TV / Movies items."
              );
            }

            return results;
          }

          function createBoxdenRss(
            entries
          ) {
            const items =
              entries
                .map((entry) => {
                  const pubDate =
                    entry.pubDate
                      ? `
                <pubDate>${escapeXml(
                  entry.pubDate
                )}</pubDate>`
                      : "";

                  const creator =
                    entry.creator
                      ? `
                <dc:creator>${escapeXml(
                  entry.creator
                )}</dc:creator>`
                      : "";

                  const description =
                    entry.description
                      ? `
                <description><![CDATA[${safeCdata(
                  entry.description
                )}]]></description>`
                      : "";

                  const content =
                    entry.content
                      ? `
                <content:encoded><![CDATA[${safeCdata(
                  entry.content
                )}]]></content:encoded>`
                      : "";

                  return `
              <item>
                <title>${escapeXml(
                  entry.title
                )}</title>
                <link>${escapeXml(
                  entry.link
                )}</link>
                <guid isPermaLink="true">${escapeXml(
                  entry.guid
                )}</guid>${pubDate}${creator}
                <category domain="${escapeXml(
                  entry.categoryDomain
                )}">${escapeXml(
                  entry.categoryName
                )}</category>${description}${content}
              </item>`;
                })
                .join("\n");

            return createRssDocument(
              boxdenFeed,
              items
            );
          }

          async function generateOptionalFeed({
            feed,
            generator,
            generatedFeeds
          }) {
            try {
              console.log(
                `Processing ${feed.feedTitle}...`
              );

              const xml =
                await generator();

              fs.writeFileSync(
                `public/${feed.outputFile}`,
                xml,
                "utf8"
              );

              generatedFeeds.push(
                feed
              );

              console.log(
                `Generated ${feed.outputFile}.`
              );
            } catch (error) {
              console.warn(
                `${feed.feedTitle} was skipped:`
              );

              console.warn(
                error.message ||
                error
              );

              if (
                await restorePreviousFeed(
                  feed
                )
              ) {
                generatedFeeds.push(
                  feed
                );

                console.warn(
                  `Kept the last successful ${feed.outputFile}.`
                );
              } else {
                console.warn(
                  `No previous ${feed.outputFile} was available.`
                );
              }
            }
          }

          (async () => {
            const browser =
              await chromium.launch({
                headless:
                  true
              });

            try {
              const context =
                await browser
                  .newContext({
                    userAgent:
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) " +
                      "AppleWebKit/537.36 (KHTML, like Gecko) " +
                      "Chrome/124.0.0.0 Safari/537.36",

                    viewport: {
                      width:
                        1440,
                      height:
                        1600
                    },

                    locale:
                      "en-US"
                  });

              fs.mkdirSync(
                "public",
                {
                  recursive:
                    true
                }
              );

              const generatedFeeds =
                [];

              for (
                const feed of
                rottenTomatoesFeeds
              ) {
                console.log(
                  `Processing ${feed.feedTitle}...`
                );

                const page =
                  await context
                    .newPage();

                try {
                  const entries =
                    await extractRottenTomatoesEntries(
                      page,
                      feed
                    );

                  if (!entries.length) {
                    throw new Error(
                      `No entries found for ${feed.feedTitle}.`
                    );
                  }

                  fs.writeFileSync(
                    `public/${feed.outputFile}`,
                    createRottenTomatoesRss(
                      feed,
                      entries
                    ),
                    "utf8"
                  );

                  generatedFeeds.push(
                    feed
                  );

                  const imageCount =
                    entries.filter(
                      (entry) =>
                        Boolean(
                          entry.image
                        )
                    ).length;

                  console.log(
                    `Generated ${entries.length} entries for ${feed.outputFile}.`
                  );

                  console.log(
                    `Poster images found: ${imageCount}/${entries.length}.`
                  );

                  for (
                    const entry of
                    entries.slice(
                      0,
                      12
                    )
                  ) {
                    console.log(
                      `- ${entry.title}: ` +
                        `${entry.href} | ` +
                        `image: ${
                          entry.image
                            ? "yes"
                            : "no"
                        }`
                    );
                  }
                } finally {
                  await page.close();
                }
              }

              await generateOptionalFeed({
                feed:
                  layoffFeed,

                generatedFeeds,

                generator:
                  async () => {
                    const page =
                      await context
                        .newPage();

                    try {
                      const entries =
                        await extractLayoffEntries(
                          page
                        );

                      if (!entries.length) {
                        throw new Error(
                          "No TheLayoff entries were found."
                        );
                      }

                      return createLayoffRss(
                        entries
                      );
                    } finally {
                      await page.close();
                    }
                  }
              });

              await generateOptionalFeed({
                feed:
                  boxdenFeed,

                generatedFeeds,

                generator:
                  async () => {
                    const entries =
                      await extractBoxdenEntries();

                    console.log(
                      `Found ${entries.length} Boxden TV / Movies items.`
                    );

                    return createBoxdenRss(
                      entries
                    );
                  }
              });

              const indexLinks =
                generatedFeeds
                  .map(
                    (feed) =>
                      `<li><a href="${escapeXml(
                        feed.outputFile
                      )}">${escapeXml(
                        feed.feedTitle
                      )}</a></li>`
                  )
                  .join("\n");

              fs.writeFileSync(
                "public/index.html",
                `<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>More Feeds</title>
          </head>
          <body>
            <h1>More Feeds</h1>
            <ul>
              ${indexLinks}
            </ul>
          </body>
          </html>`,
                "utf8"
              );

              fs.writeFileSync(
                "public/.nojekyll",
                "",
                "utf8"
              );
            } finally {
              await browser.close();
            }
          })().catch(
            (error) => {
              console.error(
                error
              );

              process.exit(
                1
              );
            }
          );
          NODE

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
